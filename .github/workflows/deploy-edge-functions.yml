# Deploy das Edge Functions do Supabase.
#
# Existe porque o editor do Dashboard não resolve os imports de `_shared/`:
# ele publica só a pasta da própria function, então `../_shared/gemini.ts` e
# companhia quebrariam. Aqui roda o CLI de verdade, que empacota `_shared`
# junto — o mesmo bundle que sai de um `supabase functions deploy` local.
#
# PRÉ-REQUISITO (uma vez): criar o segredo SUPABASE_ACCESS_TOKEN no repositório
# em Settings → Secrets and variables → Actions. O token é gerado em
# https://supabase.com/dashboard/account/tokens
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  # Permite disparar manualmente pela aba Actions, sem precisar de push.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bkrqhividgljticgjrem

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # As três functions públicas têm autenticação própria (verify_token +
      # HMAC no webhook, x-cron-secret nas agendadas), por isso --no-verify-jwt:
      # o pg_cron e a Meta chamam sem JWT do Supabase. É o mesmo que o
      # `verify_jwt = false` do config.toml diz, declarado aqui de forma
      # explícita para não depender da versão do CLI honrar o arquivo.
      - name: Deploy whatsapp-webhook
        run: supabase functions deploy whatsapp-webhook --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy daily-digest
        run: supabase functions deploy daily-digest --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy activity-reminders
        run: supabase functions deploy activity-reminders --project-ref "$PROJECT_REF" --no-verify-jwt

      # Chamada pelo app com o JWT do usuário — mantém a verificação padrão.
      - name: Deploy price-research
        run: supabase functions deploy price-research --project-ref "$PROJECT_REF"
